services:
  - type: web
    name: applytrail
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: VITE_GOATCOUNTER_SITE
        value: kaungmyat
